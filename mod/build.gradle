plugins {
    id 'java-library'
    id 'idea'
    id 'net.ltgt.errorprone' version '5.1.1'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'LatvianModder'
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            // ModDevGradle exposes this method through its dynamic Groovy DSL.
            //noinspection GroovyAssignabilityCheck
            sourceSet(sourceSets.getByName('main'))
        }
    }
}

dependencies {
    implementation 'org.jspecify:jspecify:1.0.1'
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.3'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.3'
    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"

    // KubeJS 브리지(플러그인/바인딩/이벤트). 런타임에는 모드팩의 KubeJS 를 사용한다.
    compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}") { transitive = false }
    compileOnly("dev.latvian.mods:rhino:${rhino_version}") { transitive = false }
}

tasks.named('processResources') {
    from(rootProject.file('../kubejs/config/coredefender-waves.json')) {
        into 'defaults'
    }
}

tasks.named('test') { useJUnitPlatform() }
// Geometry tests use Minecraft's actual AABB/VoxelShape implementation.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    rename { name -> name.endsWith('.template') ? name.substring(0, name.length() - '.template'.length()) : name }
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.errorprone {
        disableAllChecks = true
        error('NullAway')
        option('NullAway:OnlyNullMarked', 'true')
        option('NullAway:HandleTestAssertionLibraries', 'true')
    }
}

// 빌드 후 모드팩 인스턴스로 복사: gradlew deployToInstance
// 인스턴스 경로는 -PinstanceDir=... 또는 ~/.gradle/gradle.properties 의 instanceDir 로 지정
tasks.register('deployToInstance', Copy) {
    var instanceDir = providers.gradleProperty('instanceDir')
            .orElse('C:/Users/user/curseforge/minecraft/Instances/CoreDefender')
    dependsOn tasks.named('jar')
    from tasks.named('jar')
    into instanceDir.map { "${it}/mods" }
}

// Always expose GameTest sources to Gradle/IDE, without requiring a local modpack.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
idea.module {
    testSources.from(sourceSets.gameTest.java.srcDirs)
    testResources.from(sourceSets.gameTest.resources.srcDirs)
}
// Compile server tests during normal verification, but do not launch Minecraft.
tasks.named('check') { dependsOn tasks.named('gameTestClasses') }

// Isolated real-server regression suite; never reads or changes the player's save.
// Run with -PturretGameTests -PtestInstanceDir=<modpack instance> runTurretGameTest.
if (providers.gradleProperty('turretGameTests').isPresent()) {
    def testInstance = providers.gradleProperty('testInstanceDir').get()
    dependencies {
        gameTestRuntimeOnly fileTree(dir: "${testInstance}/mods", include: ['kubejs-neoforge-*.jar', 'rhino-*.jar', 'architectury-*.jar'])
    }
    def prepareWaveTestScripts = tasks.register('prepareWaveTestScripts', Copy) {
        from rootProject.file('../kubejs/server_scripts/coredefender')
        include 'config.js', 'progression.js', 'main.js', 'menu.js'
        into layout.buildDirectory.dir('turret-gametest/kubejs/server_scripts/coredefender')
    }
    tasks.matching { it.name == 'runTurretGameTest' }.configureEach {
        dependsOn prepareWaveTestScripts
    }
    neoForge.mods.coredefender.sourceSet(sourceSets.gameTest)
    neoForge.runs {
        turretGameTest {
            type = 'gameTestServer'
            sourceSet = sourceSets.gameTest
            gameDirectory = file('build/turret-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'coredefender'
            jvmArgument '-Xmx2G'
        }
    }
}
